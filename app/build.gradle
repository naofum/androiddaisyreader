plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.github.naofum.androiddaisyreader'
    compileSdk 37

    defaultConfig {
        applicationId "com.github.naofum.androiddaisyreader"
        minSdk 29
        targetSdk 37
        versionCode 16
        versionName '1.16'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(':daisy-engine')
    implementation libs.library
    implementation libs.option
    implementation libs.commons.io.v27
    implementation libs.commons.lang3.v39
    implementation libs.androidx.work.runtime
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.androidx.preference
    implementation libs.material
    testImplementation libs.junit
    testImplementation libs.mockito.core
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}